<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Por el Futuro </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="seccion-inicio">
        <!-- Texto superior izquierdo -->
        <div class="encabezado">
            <h1>GORDITA     </h1>
        </div>

        <!-- Contenedor de la foto principal chica con el botón superpuesto -->
        <div class="contenedor-imagen-principal">
            <img src="belen.jpeg" alt="Imagen principal" class="imagen-central-chica">
            
            <!-- Botón superpuesto visible encima de la foto -->
            <a href="segundo.html" class="btn-entra-superpuesto"> TE AMOOOO </a>
        </div>

        <!-- Galería de fotos HORIZONTALES que aparecen una tras otra al bajar -->
        <div class="galeria-horizontal">
            <div class="foto-animada oculto">
                <img src="foto 6.jpg" alt="Foto scroll 1">
            </div>
            <div class="foto-animada oculto">
                <img src="foto 8.jpg" alt="Foto scroll 2">
            </div>
            <div class="foto-animada oculto">
                <img src="FOTO 11.jpg" alt="Foto scroll 3">
            </div>
            <div class="foto-animada oculto">
                <img src="FOTO 12.jpg" alt="Foto scroll 4">
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
